<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sainNavyGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001F35"/>
      <stop offset="50%" stop-color="#002B49"/>
      <stop offset="100%" stop-color="#004D7A"/>
    </linearGradient>
    <linearGradient id="cyanNeonGrad" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Navy Rounded Tech Shield -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="url(#sainNavyGrad)" stroke="url(#cyanNeonGrad)" stroke-width="3"/>

  <!-- Circuit Background Traces -->
  <path d="M35 150 H65 L80 165 H145" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="145" cy="165" r="3" fill="#00D2FF" opacity="0.6"/>

  <path d="M165 50 H135 L120 35 H55" stroke="#00D2FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="55" cy="35" r="3" fill="#00D2FF" opacity="0.6"/>

  <!-- Stylized Book Pages (Clean White & Cyan) -->
  <!-- Left Page -->
  <path d="M100 138 C80 122 48 124 40 128 V72 C50 66 78 66 100 80 Z" 
        fill="#FFFFFF" stroke="#00D2FF" stroke-width="2"/>
  <!-- Right Page -->
  <path d="M100 138 C120 122 152 124 160 128 V72 C150 66 122 66 100 80 Z" 
        fill="url(#cyanNeonGrad)" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Book Spine Center Divider -->
  <line x1="100" y1="78" x2="100" y2="140" stroke="#001F35" stroke-width="3" stroke-linecap="round"/>

  <!-- Robotic Finger Touch / Neural Spark Node -->
  <circle cx="100" cy="55" r="14" fill="#001F35" stroke="#00D2FF" stroke-width="2.5"/>
  <circle cx="100" cy="55" r="6" fill="#00D2FF" filter="url(#cyanGlow)"/>

  <!-- Synapse Pulses to Wings -->
  <path d="M88 55 H70 L58 66" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M112 55 H130 L142 66" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="58" cy="66" r="2.5" fill="#FFFFFF"/>
  <circle cx="142" cy="66" r="2.5" fill="#FFFFFF"/>
</svg>