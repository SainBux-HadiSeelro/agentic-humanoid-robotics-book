name: Agentic Quality Gate & Spec Verification

on:
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  agentic-qa:
    name: 🛡️ Automated Spec & Code Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend_book/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd frontend_book
          npm ci

      - name: 🔍 Type Safety Verification
        run: |
          cd frontend_book
          npm run typecheck

      - name: 📋 Verify Spec-Driven Development (SDD) Records
        run: |
          echo "Verifying Spec-Driven Development structure..."
          test -d specs && echo "✅ Specs directory verified"
          test -d history/prompts && echo "✅ PHR prompt history verified"
          echo "🎉 All Agentic Quality Gates Passed!"
