name: Agentic CI/CD & GitHub Pages Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-deploy:
    name: 🤖 Agentic Verification & Deployment
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend_book/package-lock.json

      - name: 📦 Install Frontend Book Dependencies
        run: |
          cd frontend_book
          npm ci

      - name: 🧪 Agentic TypeScript Verification (0 Errors Gate)
        run: |
          cd frontend_book
          npm run typecheck

      - name: 🏗️ Compile Static Production Handbook
        run: |
          cd frontend_book
          npm run build

      - name: 🚀 Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend_book/build
          destination_dir: ./
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
